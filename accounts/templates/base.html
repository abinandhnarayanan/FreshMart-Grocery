{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FreshMart Grocery</title>

{% load static %}

<script src="{% static 'js/script.js' %}"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- Top Bar -->

<div class="top-bar">

<div class="container d-flex justify-content-between">

<div>

<i class="fa-solid fa-truck-fast"></i>

Free Delivery Above ₹499

</div>

<div>

<i class="fa-solid fa-phone"></i>

+91 9876543210

</div>

</div>

</div>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">

<div class="container">

<a class="navbar-brand fw-bold text-success" href="#">

<img src="{% static 'images/logo.png' %}" width="40">

FreshMart

</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

    <!-- Home -->
    <li class="nav-item">
        <a class="nav-link active"
           href="{% url 'home' %}">
            Home
        </a>
    </li>

    <!-- About -->
    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'home' %}#about">
            About
        </a>
    </li>

    <!-- Products -->
    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'home' %}#products">
            Products
        </a>
    </li>

    <!-- Contact -->
    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'home' %}#contact">
            Contact
        </a>
    </li>

    <!-- Cart -->
    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'cart' %}">

            <i class="fa-solid fa-cart-shopping"></i>

            Cart

        </a>
    </li>



{% if user.is_authenticated %}

<li class="nav-item">
    <a class="nav-link d-flex align-items-center" href="{% url 'profile' %}">
        <i class="fa-solid fa-circle-user fa-xl me-2"></i>
        {{ user.username }}
    </a>
</li>

{% else %}

<li class="nav-item">
    <a class="nav-link" href="{% url 'login' %}">
        Login
    </a>
</li>

{% endif %}
</ul>

</div>

</div>

</nav>

{% block content %}

{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
